[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fable-method"
version = "1.0.0"
description = "A model-agnostic reasoning-rigor enforcement engine: MCP server + CLI harness that mechanically enforce a clarify-plan-prove-critique-verify pipeline so any AI model cannot be lazy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fable Method" }]
keywords = ["llm", "reasoning", "agent", "mcp", "rigor", "verification"]

# The engine and CLI harness need NOTHING beyond the standard library.
# Everything below is optional, only for the features that use it.
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]            # only needed to run the MCP server
openai = ["openai>=1.0.0"]     # only if you drive the CLI harness with OpenAI models
anthropic = ["anthropic>=0.39.0"]
google = ["google-generativeai>=0.8.0"]
dev = ["pytest>=7.0"]
all = ["mcp>=1.0.0", "openai>=1.0.0", "anthropic>=0.39.0", "google-generativeai>=0.8.0", "pytest>=7.0"]

[project.scripts]
fable-method = "fable_method.cli_harness:main"
fable-method-server = "fable_method.mcp_server:main"

[tool.setuptools]
packages = ["fable_method", "fable_method.tests"]
